% ~~~~~~~~~~~~~~~~~~~ ZCC - Precompiler Items ~~~~~~~~~~~~~~~~~~~ %
%                                                                 %
%     This file contains all of the ZCC items that can be used in %
% Z programs. When calling a variable in a program, it will be    %
% replaced by some text.                                          %
%                                                                 %
%     This file respects the "Config" syntax described here :     %
%             https://github.com/iasebsil83/Config                %
%                                                                 %
%     Comment character is set as '%' allowing to define some     %
% precompiler directives inside precompiler variables.            %
%                                                                 %
%     Option 'ADDITIONAL_SPACES_ALLOWED' is disabled when reading %
% this file so spaces are allowed in configuration values. Please %
% remember that values are interpreted as raw text so any escape  %
% sequence (backslash) is kept as is during replacement.          %
% ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ %



% USEFUL

%root types
ROOT_SIZES	8 16 32 #CFG ARCH64 {64}
REF_SIZE	#CFG ARCH64 {64}#!CFG ARCH64 {32}
ROOT_TYPES	#FOR root_size {#{ROOT_SIZES}} {u#{root_size} s#{root_size} } f32 #CFG ARCH64 {f64} boo %"ref" excluded



% BASICS

%low-level erroring
lle_alright	^LLE.err == ^LLE.SUCCESS
lle_failed	^LLE.err != ^LLE.SUCCESS
lle_scc		^LLE.err = ^LLE.SUCCESS
lle_fai		^LLE.err = ^LLE.FAILURE
lle_oob		^LLE.err = ^LLE.OUT_OF_BOUNDS
lle_mem		^LLE.err = ^LLE.MEMORY
lle_int		^LLE.err = ^LLE.INTERNAL
lle			^LLE.err
