% ~~~~~~~~~~~~~~~~~~~ ZCC - Precompiler Items ~~~~~~~~~~~~~~~~~~~ %
%                                                                 %
%     This file contains all of the ZCC items that can be used in %
% Z programs. When calling a variable in a program, it will be    %
% replaced by some text.                                          %
%                                                                 %
% Example (in myCode.z) :                                         %
% |                                                               %
% | int <my_item_name> = <my_item_value>                          %
% |                                                               %
%     When compiling "myCode.z", the text between angle brackets  %
% will be replaced by the corresponding text in this file.        %
% (Including brackets themselves)                                 %
%                                                                 %
%     This file respects the "Config" syntax described here :     %
%             https://github.com/iasebsil83/Config                %
%                                                                 %
%     Comment character is set as '%' allowing to define some     %
% precompiler directives inside precompiler variables.            %
%                                                                 %
%     Option 'ADDITIONAL_SPACES_ALLOWED' is disabled when reading %
% this file so spaces are allowed in configuration values. Please %
% remember that values are interpreted as raw text so any escape  %
% sequence (backslash) is kept as is during replacement.          %
%                                                                 %
% This replacement is done during Pre-Processing steps.           %
% ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~ %




% STANDARD Z LIBRARY

%stdz path
stdz			#CFG SHARED_STDZ { lnk /usr/share/stdz/out/src/default } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/default }
stdz_default	#CFG SHARED_STDZ { imp /usr/share/stdz/sdl/default     } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/default } %There is no default sdl but a z file containing 'lnk ...'
stdz_all		#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/all         } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/default }

%categories
stdz_core		#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/core      } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/core/all   }
stdz_primitive	#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/primitive } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/types/all; imp /usr/share/stdz/out/src/structures/all }
stdz_math		#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/math      } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/math/all   }
stdz_os			#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/os        } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/os/all     }

%specific : graphics
stdz_2D			#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/graphics/2D } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/graphics/2D/all }
stdz_3D			#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/graphics/3D } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/graphics/3D/all }

%specific : network
stdz_tcp_udp	#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/network/tcp_udp } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/network/tcp_udp }

%specific : parsing
stdz_config		#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/parsing/data/config     } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/parsing/data/config     }
stdz_dreamlands	#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/parsing/data/dreamlands } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/parsing/data/dreamlands }

%specific : time
stdz_time		#CFG SHARED_STDZ { lnk /usr/share/stdz/sdl/time/time } #!CFG SHARED_STDZ { imp /usr/share/stdz/out/src/time/time }




% USEFUL

%root types sizes
ROOT_SIZES	8 16 32 #CFG ARCH64 {64}
REF_SIZE	#CFG ARCH64 {64}#!CFG ARCH64 {32}




% SHORTCUTS

%low-level erroring
lle_alright	^LLE.err == ^LLE.SUCCESS
lle_failed	^LLE.err != ^LLE.SUCCESS
lle_OK		^LLE.err = ^LLE.SUCCESS
lle_KO		^LLE.err = ^LLE.FAIL
lle_IX		^LLE.err = ^LLE.INDEX
lle_MM		^LLE.err = ^LLE.MEMORY
lle_IN		^LLE.err = ^LLE.INTERNAL
lle			^LLE.err




% LEVEL TABLES

%predefined levels & branches
LVLTAB__bchs	2 4 8 16
LVLTAB__lvls	1 2 3 4 %do not include level 0 !
